<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Farm Seasons</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>🌻 Pixel Farm Seasons</h1><p>Cuide da sua fazenda durante as quatro estações!</p><section class="stats"><span id="season"></span><span id="day"></span><span id="coins"></span><span id="seeds"></span><span id="harvest"></span></section><div class="actions"><button id="plant">🌱 Plantar (2 moedas)</button><button id="water">💧 Regar</button><button id="collect">🥕 Colher</button><button id="next">☀️ Próximo dia</button><button id="reset">↻ Reiniciar</button></div><div id="farm" class="farm" aria-label="Terrenos da fazenda"></div><p id="message" role="status"></p><p class="help">Selecione um terreno e plante, regue ou colha. Plantas crescem após 2 dias regados. Cada colheita rende 6 moedas. A estação muda a cada 7 dias.</p></main><script src="game.js"></script></body></html>
