<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Farm Seasons — Protótipo</title><style>
body{margin:0;background:#142a24;color:#f6f1db;font:16px system-ui}header{padding:12px 20px;display:flex;gap:22px;flex-wrap:wrap;background:#233d31}main{max-width:1000px;margin:16px auto;padding:0 12px}canvas{width:100%;background:#87b96a;border:3px solid #b5a36a;box-sizing:border-box}p{line-height:1.5}kbd{background:#334d3d;padding:3px 7px;border-radius:4px} .touch{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.touch button{font:inherit;color:white;background:#365a40;border:1px solid #88a87b;border-radius:10px;min-width:50px;min-height:48px;padding:10px;touch-action:none;cursor:pointer}@media(min-width:850px){.touch{display:none}}</style></head><body>
<header><strong>🌾 Pixel Farm Seasons</strong><span id="clock">07:00</span><span id="energy">Energia: 100</span><span id="hunger">Fome: 0</span></header>
<main><canvas id="game" width="960" height="540" aria-label="Protótipo de fazenda visto por trás do personagem"></canvas><div class="touch" aria-label="Controles para celular"><button data-hold="w">▲</button><button data-hold="a">◀</button><button data-hold="s">▼</button><button data-hold="d">▶</button><button data-key="f">🌱 Plantar</button><button data-key="e">🍲 Comer</button><button data-key="b">Comprar</button><button data-key="v">Vender</button><button data-key="p">Salvar</button><button data-key="t">🚗 Veículo</button><button data-key="x">🗺️ Expandir</button></div><p id="message" aria-live="polite">Bom dia! Hora de cuidar da fazenda.</p><p>Movimento: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> ou setas · Comer: <kbd>E</kbd> · Descansar: <kbd>R</kbd>. Plantar, regar ou colher: <kbd>F</kbd> · Comprar sementes: <kbd>B</kbd> · Vender: <kbd>V</kbd> · Salvar: <kbd>P</kbd> · Carregar: <kbd>L</kbd> · Veículos: <kbd>T</kbd> · Expandir: <kbd>X</kbd>. O tempo avança mesmo parado.</p></main>
<script src="./game.js"></script></body></html>
