name: Python gameplay regressions
on:
  push:
    paths:
      - "gameplay/**"
      - "test_*.py"
      - ".github/workflows/python-gameplay.yml"
  pull_request:
    paths:
      - "gameplay/**"
      - "test_*.py"
      - ".github/workflows/python-gameplay.yml"
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -p 'test_*.py' -v
