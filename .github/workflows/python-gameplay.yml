name: Python gameplay unit tests

on:
  push:
    branches: [main, "feature/game-finish-flow-*"]
    paths:
      - "gameplay/**"
      - "test_*.py"
      - ".github/workflows/python-gameplay.yml"
  pull_request:
    paths:
      - "gameplay/**"
      - "test_*.py"
      - ".github/workflows/python-gameplay.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -p 'test_*.py' -v
