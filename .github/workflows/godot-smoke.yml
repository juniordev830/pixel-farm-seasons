name: Godot 3D smoke test
on:
  push:
    branches: [feature/farm-daily-needs-v1]
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import project
        run: godot --headless --path godot --editor --import --quit
      - name: Parse and launch main scene
        run: godot --headless --path godot --quit-after 30
