name: Godot 3D smoke test
on:
  push:
    branches: [feature/farm-daily-needs-v1]
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-smoke.yml'
permissions:
  contents: read

concurrency:
  group: godot-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Validate engine-independent daily needs (Python)
        run: python3 -m unittest discover -p 'test_*.py' -v

      - name: Import project
        run: godot --headless --path godot --editor --import --quit
      - name: Parse and launch main scene
        run: godot --headless --path godot --quit-after 30

      - name: Validate daily needs and midnight rollover
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=5s 60s \
            godot --headless --path godot --script res://tests/needs_smoke.gd \
            | tee "${RUNNER_TEMP}/needs-smoke.log"
          grep -q 'PASS: hunger slowdown' "${RUNNER_TEMP}/needs-smoke.log"
